name: Temporary iPad case geometry fetch

on:
  push:
    branches:
      - tmp-ipad-case-geometry-fetch-20260712
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  fetch-geometry:
    runs-on: ubuntu-latest
    steps:
      - name: Search public 11-inch M4/M5 body references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p geometry/files
          python3 - <<'PY'
          import json, pathlib, re, time, urllib.request
          ROOT=pathlib.Path('geometry')
          API='https://api.printables.com/graphql/'
          UA='Mozilla/5.0 (compatible; iPadCaseCADResearch/1.0)'
          searches=[
            'iPad Pro 11 M4 dummy','iPad Pro 11 2024 model','iPad Pro M4 mockup',
            'iPad Pro 11 reference','iPad Pro 11 template','iPad Pro 11 M4 mount',
            'iPad Pro 11 M4 enclosure','iPad Pro 11 M4 bumper','iPad Pro 11 M5'
          ]
          def gql(query,variables=None,operation=None):
            p={'query':query}
            if variables is not None:p['variables']=variables
            if operation:p['operationName']=operation
            req=urllib.request.Request(API,data=json.dumps(p).encode(),headers={'User-Agent':UA,'Content-Type':'application/json'})
            with urllib.request.urlopen(req,timeout=60) as r:data=json.loads(r.read())
            if data.get('errors'):raise RuntimeError(data['errors'])
            return data['data']
          sq='''query SearchModels($query:String!,$limit:Int,$ordering:SearchChoicesEnum){result:searchPrints2(query:$query,printType:print,limit:$limit,ordering:$ordering){items{id name slug description downloadCount user{publicUsername} image{filePath}}}}'''
          fq='''query ModelFiles($id:ID!){model:print(id:$id){id name description stls{id name folder fileSize filePreviewPath} otherFiles{id name folder fileSize filePreviewPath}}}'''
          dq='''mutation GetDownloadLink($id:ID!,$modelId:ID!,$fileType:DownloadFileTypeEnum!,$source:DownloadSourceEnum!){getDownloadLink(id:$id,printId:$modelId,fileType:$fileType,source:$source){ok output{link} errors{field messages}}}'''
          results={}; flat={}
          for term in searches:
            items=gql(sq,{'query':term,'limit':50,'ordering':'best_match'},'SearchModels')['result']['items']
            results[term]=items
            for x in items:flat[str(x['id'])]=x
            time.sleep(.2)
          catalog=[]; total=0
          for pid,item in flat.items():
            model=gql(fq,{'id':pid},'ModelFiles')['model']
            if not model:continue
            text=((model.get('name') or '')+' '+(model.get('description') or '')).lower()
            entry={'id':pid,'summary':item,'model':model,'downloads':[]};catalog.append(entry)
            relevant=('ipad' in text and any(t in text for t in ('m4','m5','2024','2025')) and any(t in text for t in ('11','dummy','model','template','case','mount','enclosure','bumper')))
            if not relevant:continue
            for bucket,ftype in [('stls','stl'),('otherFiles','other')]:
              for f in model.get(bucket) or []:
                ext=pathlib.Path(f['name']).suffix.lower()
                if ext not in {'.stl','.3mf','.step','.stp','.iges','.igs','.f3d','.obj','.scad'}:continue
                if (f.get('fileSize') or 0)>40_000_000 or total>200_000_000:continue
                d=gql(dq,{'id':f['id'],'modelId':pid,'fileType':ftype,'source':'model_detail'},'GetDownloadLink')['getDownloadLink']
                link=((d or {}).get('output') or {}).get('link')
                if not link:continue
                safe=re.sub(r'[^A-Za-z0-9_.-]+','_',f['name'])
                out=ROOT/'files'/f'{pid}__{safe}'
                req=urllib.request.Request(link,headers={'User-Agent':UA})
                with urllib.request.urlopen(req,timeout=180) as r:blob=r.read()
                out.write_bytes(blob);total+=len(blob)
                entry['downloads'].append({'name':f['name'],'saved':str(out),'bytes':len(blob)})
                time.sleep(.15)
          (ROOT/'report.json').write_text(json.dumps({'searches':results,'catalog':catalog,'bytes':total},indent=2),encoding='utf-8')
          print('results',len(flat),'models',len(catalog),'bytes',total)
          for e in catalog:
            if e['downloads']:print(e['id'],e['model']['name'],e['downloads'])
          PY
          find geometry -maxdepth 3 -type f -printf '%p %s bytes\n' | sort

      - name: Upload geometry bundle
        uses: actions/upload-artifact@v4
        with:
          name: ipad-body-reference-search
          path: geometry/
          if-no-files-found: error
          retention-days: 1
